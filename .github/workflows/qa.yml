name: QA

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (SEO, accessibility, security, access control)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    env:
      OPENAI_API_KEY: ci-placeholder
      PINECONE_API_KEY: ci-placeholder
      PINECONE_ENVIRONMENT: us-east-1
      FRONTEND_ORIGINS: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup python main.py > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Build and start website
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001 > /dev/null && break; sleep 1; done
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end QA
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
